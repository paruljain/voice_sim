# VoiceSim preferences. Aircraft commands are built in. Edit this file with any text editor.
# Values do not need quotes. Leave optional device IDs and language blank.
# Lines beginning with # or ; are comments. Restart VoiceSim after editing.

[openrouter]
# OPENROUTER_API_KEY in the environment takes precedence over this value.
api_key =
# Other transcription models: openai/gpt-4o-mini-transcribe,
# mistralai/voxtral-mini-transcribe
speech_to_text_model = openai/whisper-large-v3
# Other generation model: google/gemini-2.5-flash
generation_model = openai/gpt-4.1-mini
# Blank detects the spoken language automatically; en forces English.
speech_language =
request_timeout_seconds = 30

[trigger]
key = alt
# Set both joystick values to use a joystick instead of the keyboard.
joystick_id =
joystick_button =

[audio]
# Blank uses the Windows default device. IDs are non-negative integers.
record_device_id =
playback_device_id =
